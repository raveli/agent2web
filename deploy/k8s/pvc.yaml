apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent2web-data
  namespace: agent2web
spec:
  accessModes:
    # SQLite plus local files: one writer, so ReadWriteOnce is correct.
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # k3s default is local-path; on Hetzner with the CSI driver use hcloud-volumes.
  # storageClassName: hcloud-volumes
