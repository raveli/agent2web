apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent2web
  namespace: agent2web
  labels:
    app.kubernetes.io/name: agent2web
spec:
  replicas: 1
  strategy:
    # One SQLite writer and a ReadWriteOnce volume: never run two pods at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent2web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent2web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent2web
          image: ghcr.io/raveli/agent2web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: agent2web
            - secretRef:
                name: agent2web
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent2web-data
        - name: tmp
          emptyDir: {}
