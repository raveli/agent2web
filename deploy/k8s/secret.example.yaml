# Copy to secret.yaml, fill in with `npm run gen-secrets` output, and keep it out
# of git (or manage it with sealed-secrets / external-secrets instead).
apiVersion: v1
kind: Secret
metadata:
  name: agent2web
  namespace: agent2web
type: Opaque
stringData:
  # 32+ characters. Signs cookies and hashes tokens at rest.
  A2W_SECRET: 'replace-me'
  # scrypt hash of the admin password, from `npm run gen-secrets`.
  A2W_ADMIN_PASSWORD_HASH: 'scrypt$16384$8$1$replace$me'
  # Optional: static bearer token for Claude Code / curl / CI.
  A2W_API_TOKEN: 'replace-me-or-remove'
  # Optional: base32 TOTP secret to require a second factor at sign-in.
  # A2W_ADMIN_TOTP_SECRET: ''
