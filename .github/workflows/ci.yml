name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Boots the real Worker bundle in Miniflare with local D1 and R2 and talks
      # to it over HTTP — the same code path that deploys.
      - run: npm test

  deployable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Catches a broken wrangler.jsonc or an unresolvable binding, with no
      # credentials needed.
      - run: npx wrangler deploy --dry-run
