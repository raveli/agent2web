services:
  agent2web:
    build: .
    image: ghcr.io/raveli/agent2web:latest
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      # Everything else comes from .env — see .env.example.
      A2W_DATA_DIR: /data
      A2W_PORT: '8080'
    volumes:
      - agent2web-data:/data

volumes:
  agent2web-data:
